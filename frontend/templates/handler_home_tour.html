<div class="dropdown position-fixed bottom-0 end-0 mb-3 me-3 bd-mode-toggle">
    <button class="btn btn-bd-primary py-2 dropdown-toggle d-flex align-items-center" id="bd-theme" type="button" aria-expanded="false" data-bs-toggle="dropdown" aria-label="Toggle theme (light)">
        <svg class="bi my-1 theme-icon-active" width="1em" height="1em"><use href="#sun-fill"></use></svg>
        <span class="visually-hidden" id="bd-theme-text">Toggle theme</span>
    </button>
    <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="bd-theme-text">
        <li>
            <button type="button" class="dropdown-item d-flex align-items-center active" data-bs-theme-value="light" aria-pressed="true">
                <svg class="bi me-2 opacity-50 theme-icon" width="1em" height="1em"><use href="#sun-fill"></use></svg>
                Light
                <svg class="bi ms-auto d-none" width="1em" height="1em"><use href="#check2"></use></svg>
            </button>
        </li>
        <li>
            <button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="dark" aria-pressed="false">
                <svg class="bi me-2 opacity-50 theme-icon" width="1em" height="1em"><use href="#moon-stars-fill"></use></svg>
                Dark
                <svg class="bi ms-auto d-none" width="1em" height="1em"><use href="#check2"></use></svg>
            </button>
        </li>
        <li>
            <button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="auto" aria-pressed="false">
                <svg class="bi me-2 opacity-50 theme-icon" width="1em" height="1em"><use href="#circle-half"></use></svg>
                Auto
                <svg class="bi ms-auto d-none" width="1em" height="1em"><use href="#check2"></use></svg>
            </button>
        </li>
    </ul>
</div>

        <div>

            </h3>-->
            <h3 class="float-md-start mb-0">ForkTravel</h3>
            <nav class="nav nav-masthead justify-content-center float-md-end">
                <a class="nav-link fw-bold py-1 px-0 active" aria-current="page" href="/home/">Главная</a>
                <a class="nav-link fw-bold py-1 px-0" href="/tours/">Все туры</a>
            </nav>
        </div>
    </header>


    <div class="dropdown-container p-2 d-flex flex-row " >
        <label for="fromDropdown"></label>
        <select class="dropdown p-2 fw-bold" id="fromDropdown" >
            <option value="" disabled selected hidden>Откуда</option>
            <option value="option1">Список 1</option>
            <option value="option2">Список 1 - Опция 1</option>
            <option value="option3">Список 1 - Опция 2</option>
        </select>

        <label for="preferencesDropdown"> </label>
        <select class="dropdown p-2 fw-bold" id="preferencesDropdown" name="preferencesDropdown" multiple>
            <option value="" disabled selected hidden>Предпочтения</option>
            <option value="option1 ">Список 2</option>
            <option value="option2">Список 2 - Опция 1</option>
            <option value="option3">Список 2 - Опция 2</option>
        </select>

        <label for="filtersDropdown"> </label>
        <select class="dropdown p-2 fw-bold " id="filtersDropdown" name="filtersDropdown" multiple>
            <option value="" disabled selected hidden>Фильтры</option>
            <option value="option1 ">Список 3</option>
            <option value="option2">Список 3 - Опция 1</option>
            <option value="option3">Список 3 - Опция 2</option>
        </select>
        <button class="buttonSelect" type="button" onclick="submitForm()">Поиск</button>
    </div>

    <script>
        function submitForm() {
            var fromDropdown = document.getElementById("fromDropdown").value;

            var preferencesDropdownValues = [];
            var preferencesDropdownElements = document.getElementById("preferencesDropdown").options;
            for (var i = 0; i < preferencesDropdownElements.length; i++) {
                if (preferencesDropdownElements[i].selected) {
                    preferencesDropdownValues.push(preferencesDropdownElements[i].value);
                }
            }

            var filtersDropdownValues = [];
            var filtersDropdownElements = document.getElementById("filtersDropdown").options;
            for (var i = 0; i < filtersDropdownElements.length; i++) {
                if (filtersDropdownElements[i].selected) {
                    filtersDropdownValues.push(filtersDropdownElements[i].value);
                }
            }

            // Выполните здесь дополнительные проверки, если необходимо

            var url = "/your-go-endpoint?fromDropdown=" + encodeURIComponent(fromDropdown) + "&preferencesDropdown=" +
                encodeURIComponent(preferencesDropdownValues.join(',')) + "&filtersDropdown=" + encodeURIComponent(filtersDropdownValues.join(','));

            // Перенаправление на URL-адрес с параметрами
            window.location.href = url;
        }
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

    <script>
