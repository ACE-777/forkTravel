        }

            margin-right: 2px;
            color: #343A40FF;
            border: none;
        }
        #filtersDropdown option[disabled] {
            font-weight: bold;
            display: none;
        }
        #preferencesDropdown option[disabled] {
            display: none;
        }
        #fromDropdown option[disabled] {
            font-weight: bold;
            display: none;
        }
        .select2-results__option {
            color: #343A40FF;
        }
        .select2-container .select2-results__option[aria-selected="true"] {
            background-color: rgba(13, 202, 240);
            color: #343A40FF;
        }

    <div class="dropdown-container d-flex flex-row fw-bold" style="padding: 10px">
        <label for="fromDropdown"> </label>
        <select class="dropdown p-2 fw-bold justify-content-center" id="fromDropdown" name="fromDropdown" >
            <option  value="" disabled selected hidden >Откуда</option>
            <option value="SPB">СПб</option>
            <option value="MSC">МСК</option>
            <option value="EKB">ЕКБ</option>
        </select>
        <label for="preferencesDropdown"> </label>
        <select class="dropdown p-2  fw-bold " id="preferencesDropdown" name="preferencesDropdown" multiple>
            <option value="sea">Пляжный отдых</option>
            <option value="excursion">Исторический центр</option>
            <option value="mountain">Горнолыжный курорт</option>
            <option value="health">Здоровый отдых</option>
        </select>
        <label for="filtersDropdown"></label>
        <select class="dropdown p-2 fw-bold " id="filtersDropdown" name="filtersDropdown" multiple>
            <option value="without_visa">Безвизовый режим</option>
            <option value="visa">Визовый режим</option>
            <option value="electronic_visa">Электронная виза</option>
            <option value="in_one">В одной стране</option>
            <option value="in_various">В разных странах</option>
        </select>
        <button class="buttonSelect fw-bold" type="button" style="color:#343A40FF;" onclick="submitForm()">Поиск</button>
    </div>



    <script>
        function submitForm() {
            var fromDropdown = document.getElementById("fromDropdown").value;

            var preferencesDropdownValues = [];
            var preferencesDropdownElements = document.getElementById("preferencesDropdown").options;
            for (var i = 0; i < preferencesDropdownElements.length; i++) {
                if (preferencesDropdownElements[i].selected) {
                    preferencesDropdownValues.push(preferencesDropdownElements[i].value);
                }
            }

            var filtersDropdownValues = [];
            var filtersDropdownElements = document.getElementById("filtersDropdown").options;
            for (var i = 0; i < filtersDropdownElements.length; i++) {
                if (filtersDropdownElements[i].selected) {
                    filtersDropdownValues.push(filtersDropdownElements[i].value);
                }
            }

            if (filtersDropdownValues.includes("without_visa") && filtersDropdownValues.includes("visa")){
                alert("Пожалуйста, выберите только одно значение связанное с визовым режимом.");
            } else{
                if (fromDropdown && preferencesDropdownValues.length > 0) {
                    var url = "/result/?from=" + encodeURIComponent(fromDropdown) + "&preferences=" +
                        encodeURIComponent(preferencesDropdownValues.join(',')) + "&filters=" + encodeURIComponent(filtersDropdownValues.join(','));

                    window.location.href = url;
                } else {
                    alert("Пожалуйста, выберите значения из списков.");
                }
            }


        }
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#fromDropdown').select2({
                placeholder: 'Откуда',
                allowClear: true,
                color: "#343A40FF",
                width: 180
            });
        });

        $(document).ready(function() {
            $('#preferencesDropdown').select2({
                placeholder: 'Предпочтения',
                allowClear: true,
                width: 250
            });
        });

        $(document).ready(function() {
            $('#filtersDropdown').select2({
                placeholder: 'Фильтры',
                allowClear: true,
                width: 230
            });

        });

        $('#preferencesDropdown').on('select2:select', function(e){
            var id = e.params.data.id;
            var option = $(e.target).children('[value="'+id+'"]');
            option.detach();
            $(e.target).append(option).change();
        });
    </script>
